name: CI

# Gate determinístico (Fase 1): typecheck + lint + unit tests.
# Sem browser, sem banco, sem secrets — nada toca Supabase, Yahoo Finance ou Anthropic.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Push em qualquer branch + PR para main geram runs duplicados na branch da PR.
# Cancelar o run obsoleto poupa minutos de Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npx playwright test -c playwright.unit.config.ts
