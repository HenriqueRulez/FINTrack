name: CI

# Gate determinístico (Fase 1): typecheck + lint + unit tests.
# Sem browser, sem banco, sem secrets — nada toca Supabase, Yahoo Finance ou Anthropic.
on: [push]
# Push em qualquer branch + PR para main geram runs duplicados na branch da PR.
# Cancelar o run obsoleto poupa minutos de Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Instala deps de forma reproduzível com `npm ci`. Auto-cura o único caso
      # crónico: o dev é Windows e o CI é Linux; as optional deps wasm (@emnapi/*)
      # resolvem diferente por OS, dessincronizando o package-lock.json só no Linux.
      # Se e SÓ se o `npm ci` falhar por isso, cai para `npm install` (que reconcilia
      # o lockfile neste run) e segue. Sem commit de volta, sem intervenção manual.
      #
      # GUARD (A4): o fallback `npm install` aceitava qualquer divergência de
      # lockfile — mascarava drift real (dep adulterada, versão não commitada).
      # `lockfile-guard.mjs` inspecciona QUE entradas mudaram e falha o job se o
      # auto-heal tocar qualquer pacote fora da allowlist wasm conhecida. Só wasm
      # → verde com warning (comportamento preservado); resto → vermelho com diff.
      - name: Instalar deps (npm ci, com auto-heal do lockfile cross-platform + guard)
        run: |
          if npm ci; then
            echo "npm ci OK — lockfile em sync"
          else
            echo "::warning::npm ci falhou (lockfile Windows x Linux fora de sync); auto-heal com npm install"
            npm install --no-audit --no-fund
            node .github/scripts/lockfile-guard.mjs
          fi

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:unit
