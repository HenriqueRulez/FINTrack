name: CI

# Gate determinístico (Fase 1): typecheck + lint + unit tests.
# Sem browser, sem banco, sem secrets — nada toca Supabase, Yahoo Finance ou Anthropic.
on: [push]
# Push em qualquer branch + PR para main geram runs duplicados na branch da PR.
# Cancelar o run obsoleto poupa minutos de Actions.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Instala deps de forma reproduzível com `npm ci`. Auto-cura o único caso
      # crónico: o dev é Windows e o CI é Linux; as optional deps wasm (@emnapi/*)
      # resolvem diferente por OS, dessincronizando o package-lock.json só no Linux.
      # Se e SÓ se o `npm ci` falhar por isso, cai para `npm install` (que reconcilia
      # o lockfile neste run) e segue. Sem commit de volta, sem intervenção manual.
      #
      # GUARD (A4): o fallback `npm install` aceitava qualquer divergência de
      # lockfile — mascarava drift real (dep adulterada, versão não commitada).
      # `lockfile-guard.mjs` inspecciona QUE entradas mudaram e falha o job se o
      # auto-heal tocar qualquer pacote fora da allowlist wasm conhecida. Só wasm
      # → verde com warning (comportamento preservado); resto → vermelho com diff.
      - name: Instalar deps (npm ci, com auto-heal do lockfile cross-platform + guard)
        run: |
          if npm ci; then
            echo "npm ci OK — lockfile em sync"
          else
            echo "::warning::npm ci falhou (lockfile Windows x Linux fora de sync); auto-heal com npm install"
            npm install --no-audit --no-fund
            node .github/scripts/lockfile-guard.mjs
          fi

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:unit

  # Auditoria de supply chain (A5). Job SEPARADO e INDEPENDENTE do gate: corre em
  # paralelo, o seu resultado não afeta o "Deterministic gate". Começa NÃO-REQUIRED
  # / informativo — CVEs novos pintam este job de vermelho sem qualquer commit, por
  # isso observa-se a taxa de falsos vermelhos antes de o tornar required (decisão
  # futura registada no TODO, item A5).
  #
  # `npm audit` lê apenas o package-lock.json — NÃO precisa de node_modules nem de
  # `npm ci`. Por isso este job NÃO reutiliza o auto-heal+guard do gate (evita
  # duplicar lógica frágil de instalação): checkout + setup-node + audit directo.
  # Verificado 2026-08-07: `npm audit --audit-level=high` só com o lockfile devolve
  # "found 0 vulnerabilities", exit 0, sem node_modules.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: npm audit (severidade high+critical)
        run: npm audit --audit-level=high

  # Build de produção (B4). Job SEPARADO e INDEPENDENTE do gate: corre em paralelo,
  # o seu resultado não afeta o "Deterministic gate". Começa NÃO-REQUIRED /
  # informativo — promover a required é decisão futura registada no TODO (item B4).
  #
  # Porquê no CI: `next build` apanha erros que o typecheck NÃO vê — violações da
  # fronteira servidor/cliente e imports de módulos `server-only` em Client
  # Components (as regras de segurança do CLAUDE.md). O typecheck valida tipos; o
  # build valida a compilação real e a divisão de bundles.
  #
  # SEM secrets reais: verificado 2026-08-07 (B4) que `next build` corre limpo
  # (exit 0, 19 páginas estáticas geradas) num checkout sem `.env.local`, apenas com
  # valores DUMMY para as env `NEXT_PUBLIC_*` que os clientes Supabase lêem. As
  # chaves só são usadas em runtime (getUser/queries), nunca no build. Nenhuma chave
  # real toca o CI. O job precisa de node_modules, por isso reutiliza o mesmo passo
  # de instalação auto-curável+guard do gate (ao contrário do audit, que só lê o
  # lockfile).
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar deps (npm ci, com auto-heal do lockfile cross-platform + guard)
        run: |
          if npm ci; then
            echo "npm ci OK — lockfile em sync"
          else
            echo "::warning::npm ci falhou (lockfile Windows x Linux fora de sync); auto-heal com npm install"
            npm install --no-audit --no-fund
            node .github/scripts/lockfile-guard.mjs
          fi

      - run: npm run build
